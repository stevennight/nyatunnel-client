name: Release

# Push a tag v<VERSION> to publish the CLI for every platform and the GUI installers
# (Windows NSIS, macOS dmg for arm64 and x64, Linux AppImage and deb).
# Versions with a suffix (0.2.0-beta.1) are published as pre-releases.
# Running it by hand (workflow_dispatch) builds every artifact as a dry run without publishing.
on:
  push:
    tags:
      - v*
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      build_date: ${{ steps.meta.outputs.build_date }}
      prerelease: ${{ steps.meta.outputs.prerelease }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check tag matches VERSION
        id: meta
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION ${version}" >&2
            exit 1
          fi
          gui_version="$(node -p "require('./gui/package.json').version")"
          if [ "${gui_version}" != "${version}" ]; then
            echo "gui/package.json version ${gui_version} does not match VERSION ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          case "${version}" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet and test
        run: |
          go vet ./...
          go test ./...

  cli:
    name: Build CLI archives
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          BUILD_DATE: ${{ needs.verify.outputs.build_date }}
        run: |
          LDFLAGS="-s -w -X nyatunnel-client/internal/shared/version.Version=v${VERSION} -X nyatunnel-client/internal/shared/version.Commit=${GITHUB_SHA} -X nyatunnel-client/internal/shared/version.BuildDate=${BUILD_DATE}"
          mkdir -p dist stage
          for target in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            label="${arch/amd64/x64}"
            name="NyaTunnel-CLI_${VERSION}_${os}_${label}"
            exe="nyatunnel"; [ "$os" = windows ] && exe="nyatunnel.exe"
            rm -rf "stage/${name}" && mkdir -p "stage/${name}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -buildvcs=false -ldflags "$LDFLAGS" -o "stage/${name}/${exe}" ./cmd/nyatunnel
            cp README.md "stage/${name}/"
            if [ "$os" = windows ]; then
              (cd stage && zip -qr "../dist/${name}.zip" "${name}")
            else
              tar -czf "dist/${name}.tar.gz" -C stage "${name}"
            fi
          done

      - name: Upload CLI archives
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cli
          path: dist/*
          if-no-files-found: error

  gui:
    name: Build GUI (${{ matrix.label }})
    needs: verify
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows_x64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - label: macos_arm64
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - label: macos_x64
            os: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
          - label: linux_x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl file libayatana-appindicator3-dev libgtk-3-dev librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf pkg-config wget

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "gui/src-tauri -> target"
          key: ${{ matrix.target }}

      - name: Build core sidecar
        env:
          NYATUNNEL_VERSION: ${{ needs.verify.outputs.version }}
          NYATUNNEL_COMMIT: ${{ github.sha }}
          NYATUNNEL_BUILD_DATE: ${{ needs.verify.outputs.build_date }}
        run: node scripts/build-sidecar.mjs --target ${{ matrix.target }}

      - name: Install GUI dependencies
        working-directory: gui
        run: npm ci

      - name: Build installer
        env:
          NYATUNNEL_VERSION: ${{ needs.verify.outputs.version }}
        run: node scripts/tauri-build.mjs --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked

      - name: Collect installers
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TARGET: ${{ matrix.target }}
          LABEL: ${{ matrix.label }}
        run: |
          bundle="gui/src-tauri/target/${TARGET}/release/bundle"
          mkdir -p release-artifacts
          found=0
          while IFS= read -r -d '' file; do
            ext="${file##*.}"
            dest="release-artifacts/NyaTunnel_${VERSION}_${LABEL}.${ext}"
            test ! -e "$dest" || { echo "More than one .${ext} installer was produced" >&2; exit 1; }
            cp "$file" "$dest"
            found=$((found + 1))
          done < <(find "$bundle" -type f \( -name '*-setup.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \) -print0)
          test "$found" -gt 0 || { echo "No installers were produced in ${bundle}" >&2; exit 1; }
          ls -l release-artifacts

      - name: Upload installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gui-${{ matrix.label }}
          path: release-artifacts/*
          if-no-files-found: error

  docker-image:
    name: Headless client image
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Prepare image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nyatunnel" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        if: github.ref_type == 'tag'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.verify.outputs.prerelease != 'true' }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && needs.verify.outputs.prerelease != 'true' }}
            type=raw,value=dry-run,enable=${{ github.ref_type != 'tag' }}

      - name: Build and push image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: ${{ github.ref_type == 'tag' }}
          build-args: |
            NYATUNNEL_VERSION=v${{ needs.verify.outputs.version }}
            NYATUNNEL_COMMIT=${{ github.sha }}
            NYATUNNEL_BUILD_DATE=${{ needs.verify.outputs.build_date }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: Publish GitHub release
    if: github.ref_type == 'tag'
    needs: [verify, cli, gui, docker-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: Write checksums
        run: |
          cd dist
          rm -f SHA256SUMS
          sha256sum * > SHA256SUMS
          ls -l
          cat SHA256SUMS

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: NyaTunnel Client ${{ github.ref_name }}
          prerelease: ${{ needs.verify.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: dist/*
