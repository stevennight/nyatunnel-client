name: Release

# Push a tag v<VERSION> to publish the CLI for every platform.
# Versions with a suffix (0.2.0-beta.1) are published as pre-releases.
# The GUI installers (Windows NSIS, macOS dmg, Linux AppImage/deb) join this workflow in M2/M3.
on:
  push:
    tags:
      - v*

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      build_date: ${{ steps.meta.outputs.build_date }}
      prerelease: ${{ steps.meta.outputs.prerelease }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check tag matches VERSION
        id: meta
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          case "${version}" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet and test
        run: |
          go vet ./...
          go test ./...

  cli:
    name: Build CLI archives
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          BUILD_DATE: ${{ needs.verify.outputs.build_date }}
        run: |
          LDFLAGS="-s -w -X nyatunnel-client/internal/shared/version.Version=v${VERSION} -X nyatunnel-client/internal/shared/version.Commit=${GITHUB_SHA} -X nyatunnel-client/internal/shared/version.BuildDate=${BUILD_DATE}"
          mkdir -p dist stage
          for target in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            label="${arch/amd64/x64}"
            name="NyaTunnel-CLI_${VERSION}_${os}_${label}"
            exe="nyatunnel"; [ "$os" = windows ] && exe="nyatunnel.exe"
            rm -rf "stage/${name}" && mkdir -p "stage/${name}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -buildvcs=false -ldflags "$LDFLAGS" -o "stage/${name}/${exe}" ./cmd/nyatunnel
            cp README.md "stage/${name}/"
            if [ "$os" = windows ]; then
              (cd stage && zip -qr "../dist/${name}.zip" "${name}")
            else
              tar -czf "dist/${name}.tar.gz" -C stage "${name}"
            fi
          done
          (cd dist && sha256sum * > SHA256SUMS)

      - name: Upload CLI archives
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cli
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [verify, cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: List release files
        run: ls -l dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: NyaTunnel Client ${{ github.ref_name }}
          prerelease: ${{ needs.verify.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: dist/*
